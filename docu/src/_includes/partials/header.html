<header class="site-chrome-header">
    <div class="site-chrome-header__inner">
        <a class="site-chrome-header__brand" href="{{ '/' | url }}" aria-label="Prysel">
            <img
                src="{{ '/img/prysel_logo.png' | url }}"
                alt="Prysel"
                class="site-chrome-header__logo"
                width="120"
                height="28"
                decoding="async"
            />
        </a>

        <nav class="site-chrome-header__nav" aria-label="Primary">
            {% for item in navigation.header %}
                <a
                    href="{% if item.external %}{{ item.url }}{% elif item.docsHome %}{{ '/' | url }}{% elif item.app %}{{ site.appUrl }}{{ item.url }}{% else %}{{ item.url | url }}{% endif %}"
                    class="site-chrome-header__link{% if not item.mobile %} site-chrome-header__link--desktop{% endif %}"
                    {% if item.external %}target="_blank" rel="noopener noreferrer"{% endif %}
                    {% if item.docsHome %}aria-current="page"{% endif %}
                >
                    {{ item.caption }}
                </a>
            {% endfor %}

            <button
                type="button"
                class="site-chrome-header__search"
                data-action="open-search"
                aria-label="Open search"
            >
                {% svgIcon './src/img/icon/search.svg', 'site-chrome-header__search-icon' %}
                <span class="site-chrome-header__search-label">Search…</span>
                <kbd class="site-chrome-header__kbd">⌘K</kbd>
            </button>

            <button
                type="button"
                class="site-chrome-header__docs-toggle"
                data-action="sidebar-toggle"
                aria-controls="primary-menu"
                aria-expanded="false"
                aria-label="Toggle documentation menu"
            >
                {% svgIcon './src/img/icon/menu.svg', 'site-chrome-header__menu-icon' %}
            </button>
        </nav>
    </div>
</header>
