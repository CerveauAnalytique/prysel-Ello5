# Deploy /docu (Spruce CSS Eleventy) to GitHub Pages.
#
# Setup once in the repo:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#
# Linked product repo: https://github.com/EricksonAtHome/ElloFive
# Optional repo variable DOCS_PATH_PREFIX (e.g. /ElloFive/) overrides the default
# /<repository-name>/ path prefix used for project GitHub Pages URLs.

name: Deploy Documentation

on:
  push:
    branches:
      - main
    paths:
      - 'docu/**'
      - '.github/workflows/deploy-docu-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-docu
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docu
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: docu/package-lock.json

      - name: Resolve path prefix
        id: prefix
        run: |
          if [ -n "${{ vars.DOCS_PATH_PREFIX }}" ]; then
            echo "value=${{ vars.DOCS_PATH_PREFIX }}" >> "$GITHUB_OUTPUT"
          else
            echo "value=/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build documentation site
        env:
          NODE_ENV: production
          PATH_PREFIX: ${{ steps.prefix.outputs.value }}
        run: npm run build-ghpages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docu/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
